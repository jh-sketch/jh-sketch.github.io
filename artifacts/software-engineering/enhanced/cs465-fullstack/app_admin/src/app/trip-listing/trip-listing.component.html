<!-- Display a loading message -->
<div *ngIf="isLoading" class="alert alert-info" role="status">
  Loading trips...
</div>

<!-- Display a user-friendly error message -->
<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>



<!-- <pre>{{trips | json}}</pre> -->
<div *ngIf="isLoggedIn()">
  <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>

<div class="row">
 <div *ngFor="let trip of trips" class="col-md-4">

    <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card>
  </div>
</div>
